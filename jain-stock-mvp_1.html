<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Jain Automobiles · Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!--
============================================================================
 JAIN AUTOMOBILES · GMA & PARTS STOCK · MVP (single file)
============================================================================
 PURPOSE
   A working prototype that shows exactly what the stock system must do.
   It is NOT the production build. All data lives in this browser
   (localStorage), so each device has its own copy. Use Settings > Data
   to back up, restore, or export every tab as Google Sheets ready CSV.

 HANDOVER NOTES FOR DEVELOPERS
   1. Layers are separated on purpose:
        UI (render functions)  ->  API.call(action, ...)  ->  OPS (business rules)  ->  DB
      Replace DB + mutate() with a real backend (Apps Script / Supabase /
      Postgres / MongoDB). Keep the OPS action names and payload shapes as
      the API contract.
   2. The LEDGER is the source of truth. Stock = sum of ledger qty per part.
      Rows are append-only. Corrections are REVERSAL or ADJUST rows.
   3. Destinations (display walls, display bikes, offsite, customer vehicles)
      are not warehouses. Their "holding" = -(sum of ledger qty with that
      destinationId).
   4. Every mutating action: session check -> permission check -> validate ->
      write ledger -> write audit -> save. In production this must run
      server-side inside one DB transaction with a row lock per part.
   5. Passwords: salted SHA-256, 300 rounds, done in the browser. Production
      must use bcrypt/argon2 on the server. Never trust this client.
============================================================================
-->
<style>
:root{
  --bg:#0e0e10;--bg-2:#131316;--surface:#18181c;--surface-2:#1f1f24;--surface-3:#27272d;
  --line:#2b2b32;--line-2:#3a3a43;--text:#eeece6;--text-2:#bdb9ae;--muted:#8d8980;
  --gold:#c9a24b;--gold-2:#e5c77f;--gold-dim:rgba(201,162,75,.14);--gold-line:rgba(201,162,75,.35);
  --red:#e3695d;--red-dim:rgba(227,105,93,.14);--amber:#e3a63f;--amber-dim:rgba(227,166,63,.14);
  --green:#58b983;--green-dim:rgba(88,185,131,.14);--blue:#7aaade;--blue-dim:rgba(122,170,222,.14);
  --radius:14px;--radius-sm:9px;--sidebar:248px;--topbar:64px;
  --f-display:'Rajdhani','Arial Narrow',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-2);text-decoration:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0}
.ic{flex:none;display:block}
.muted{color:var(--muted)}.strong{font-weight:600}.sub{font-size:12px;color:var(--muted)}
.code{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--gold-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
::selection{background:var(--gold);color:#111}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-3);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:var(--gold);color:#17130a}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--red-dim);border-color:rgba(227,105,93,.45);color:#ffb4ab}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
input,select,textarea{width:100%;height:42px;padding:0 12px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius-sm);outline:none;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
input[type=date]{color-scheme:dark}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.field .req{color:var(--gold)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.span-2{grid-column:span 2}.span-3{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--text);cursor:pointer;padding:10px 0}
.hint{color:var(--muted);font-size:13px;margin:4px 0 14px}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.green{color:var(--green);background:var(--green-dim)}
.badge.red{color:var(--red);background:var(--red-dim)}
.badge.amber{color:var(--amber);background:var(--amber-dim)}
.badge.blue{color:var(--blue);background:var(--blue-dim)}
.badge.gold{color:var(--gold-2);background:var(--gold-dim)}
.badge.muted{color:var(--muted);background:var(--surface-3)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--surface-3);font-size:12px;color:var(--text-2);white-space:nowrap}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{position:relative;overflow:hidden;padding:56px;display:flex;flex-direction:column;justify-content:space-between;background:
  radial-gradient(1200px 600px at -10% 110%,rgba(201,162,75,.18),transparent 60%),
  repeating-linear-gradient(115deg,transparent 0 22px,rgba(201,162,75,.045) 22px 23px),
  linear-gradient(160deg,#141417,#0b0b0d);border-right:1px solid var(--line)}
.login-art h2{font-size:clamp(34px,4.2vw,58px);line-height:1;max-width:12ch;color:var(--text)}
.login-art h2 em{font-style:normal;color:var(--gold-2)}
.login-art p{color:var(--text-2);max-width:44ch;font-size:15px}
.login-points{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:560px}
.login-points div{border-top:1px solid var(--gold-line);padding-top:10px;font-size:13px;color:var(--text-2)}
.login-points b{display:block;font-family:var(--f-display);font-size:22px;color:var(--gold-2)}
.login-side{display:grid;place-items:center;padding:32px 20px}
.login-card{width:100%;max-width:380px}
.login-card h1{font-size:34px;margin:28px 0 4px}
.login-card .field{margin-top:16px}
.login-card .btn{width:100%;margin-top:22px;height:48px;font-size:15px}
.login-err{margin-top:14px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--red-dim);color:#ffb4ab;font-size:13px}
.login-note{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pw-wrap{position:relative}.pw-wrap input{padding-right:64px}
.pw-wrap button{position:absolute;right:6px;top:6px;height:30px;padding:0 10px;border:0;border-radius:6px;background:var(--surface-3);font-size:12px;cursor:pointer;color:var(--text-2)}

/* ---------- Brand ---------- */
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}
.brand-mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#2a2419,#16130c);border:1px solid var(--gold-line);font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--gold-2);letter-spacing:.04em;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.08em;line-height:1.05}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.04em}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--text-2);font-weight:500;position:relative}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.on{background:var(--gold-dim);color:var(--gold-2)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav a .count{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:99px;background:var(--gold);color:#17130a;font-size:11px;font-weight:700;display:grid;place-items:center}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid var(--line);margin-top:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-3);border:1px solid var(--gold-line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--gold-2);flex:none}
.me-info{min-width:0;flex:1}.me-info .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me-info .r{font-size:11.5px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar);position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:0 28px;background:rgba(14,14,16,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .mob-brand{display:none}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);padding:0 10px;height:30px;border-radius:99px;border:1px solid var(--line)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(88,185,131,.6);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,185,131,.5)}70%{box-shadow:0 0 0 8px rgba(88,185,131,0)}100%{box-shadow:0 0 0 0 rgba(88,185,131,0)}}
.view{padding:26px 28px 48px;width:100%;max-width:1480px;margin:0 auto}
.bottomnav{display:none}
.mvp-flag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2);border:1px dashed var(--gold-line);border-radius:6px;padding:3px 8px;white-space:nowrap}

/* ---------- Panels, grids ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.panel h2{font-size:19px;margin-bottom:4px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{margin:0}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat .l{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.1;margin-top:6px}
.stat .s{font-size:12.5px;color:var(--text-2)}
.stat.gold .v{color:var(--gold-2)}.stat.red .v{color:var(--red)}.stat.amber .v{color:var(--amber)}
.stat.gold{border-color:var(--gold-line);background:linear-gradient(160deg,rgba(201,162,75,.10),var(--surface) 60%)}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.greet h2{font-size:30px}.greet p{margin:2px 0 0;color:var(--muted)}
.quick{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{padding-left:40px}
.toolbar select,.toolbar input[type=date]{width:auto;min-width:150px}
.tabs{display:flex;gap:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:34px;padding:0 14px;border-radius:9px;border:0;background:transparent;color:var(--text-2);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--surface-3);color:var(--gold-2)}
.tabs button .n{margin-left:6px;color:var(--muted);font-weight:500}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;min-width:680px}
.t th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:rgba(255,255,255,.018)}
.t th.num,.t td.num{text-align:right}
.t td.actions{text-align:right;white-space:nowrap}
.t .qty{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.bar{height:5px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin:6px 0 4px;min-width:90px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--green)}
.bar i.low{background:var(--amber)}.bar i.out{background:var(--red)}.bar i.over{background:var(--blue)}
.qpos{color:var(--green);font-weight:700}.qneg{color:var(--red);font-weight:700}
.empty{padding:36px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius)}
.strike{text-decoration:line-through;opacity:.55}

/* ---------- Lists ---------- */
.alert-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.alert-row:last-child{border-bottom:0}
.alert-row .grow{flex:1;min-width:0}
.alert-row .grow .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.feed-dot.green{background:var(--green-dim);color:var(--green)}.feed-dot.gold{background:var(--gold-dim);color:var(--gold-2)}
.feed-dot.blue{background:var(--blue-dim);color:var(--blue)}.feed-dot.amber{background:var(--amber-dim);color:var(--amber)}.feed-dot.red{background:var(--red-dim);color:var(--red)}
.feed-item .t1{font-size:13.5px}.feed-item .t2{font-size:12px;color:var(--muted)}
.cat-row{display:grid;grid-template-columns:130px 1fr 60px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.cat-row .track{height:10px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.cat-row .track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:9px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px}
.kv div{min-width:0}.kv .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.kv .v{font-weight:600;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.card h3{font-size:18px}.card p{margin:0;color:var(--muted);font-size:13px;flex:1}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.big-num{font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--gold-2);line-height:1}
.timeline{border-left:2px solid var(--line-2);margin-left:6px;padding-left:16px}
.timeline div{position:relative;padding:4px 0 10px;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-22px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--surface)}
.timeline span{color:var(--muted);font-size:12px}
.note{background:var(--gold-dim);border:1px solid var(--gold-line);color:var(--text);padding:12px 14px;border-radius:var(--radius-sm);font-size:13px}
.note.red{background:var(--red-dim);border-color:rgba(227,105,93,.4)}
.section-title{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

/* ---------- Lines editor ---------- */
.lines{display:flex;flex-direction:column;gap:10px;margin:18px 0 6px}
.lines-head{display:grid;grid-template-columns:1fr 110px 38px;gap:10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.line{display:grid;grid-template-columns:1fr 110px 38px;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg-2)}
.line .ln-info{font-size:12px;margin-top:6px;min-height:16px}
.line .ln-info b{color:var(--gold-2)}
.lines>.btn{align-self:flex-start}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(5,5,6,.7);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:760px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:rise .18s ease-out}
.modal.wide{max-width:1000px}.modal.narrow{max-width:460px}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:22px;flex:1}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- Toasts ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{min-width:260px;max-width:380px;padding:12px 16px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line-2);box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:13.5px;animation:rise .2s;pointer-events:auto}
.toast.ok{border-color:rgba(88,185,131,.5)}.toast.error{border-color:rgba(227,105,93,.6);background:#2a1917}

/* ---------- Paper (challan) ---------- */
.paper{background:#fff;color:#141414;border-radius:8px;padding:28px;font-size:12.5px;font-family:var(--f-body)}
.paper .p-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #141414;padding-bottom:12px}
.paper .p-brand{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.06em}
.paper .p-sub{font-size:11px;color:#555}

<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div id="print-root"></div>

<script>
'use strict';
/* =========================================================================
   0. SMALL HELPERS
   ========================================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=86400000;
let CLOCK=null; const now=()=>CLOCK||Date.now();
function randHex(n){const a=new Uint8Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.random()*256|0}return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
const uid=p=>p+'_'+Date.now().toString(36)+randHex(4);
const fmtN=n=>Number(n||0).toLocaleString('en-IN');
const fmtINR=n=>'₹'+Math.round(Number(n||0)).toLocaleString('en-IN');
const fmtD=ts=>ts?new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'-';
const fmtDT=ts=>ts?new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const isoDate=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const startOfDay=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';const d=Math.floor(s/86400);return d===1?'yesterday':d+' days ago'}
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

/* Pure-JS SHA-256 (works on file:// and every browser) */
function sha256(str){
  const ascii=unescape(encodeURIComponent(str));
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));const maxWord=Math.pow(2,32);let result='';
  const words=[];const bitLen=ascii.length*8;
  let hash=sha256.h=sha256.h||[];const k=sha256.k=sha256.k||[];let pc=k.length;const isC={};
  for(let c=2;pc<64;c++){if(!isC[c]){for(let i=0;i<313;i+=c)isC[i]=c;hash[pc]=(Math.pow(c,.5)*maxWord)|0;k[pc++]=(Math.pow(c,1/3)*maxWord)|0}}
  let s=ascii+'\x80';while(s.length%64-56)s+='\x00';
  for(let i=0;i<s.length;i++){const j=s.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bitLen/maxWord)|0);words[words.length]=bitLen;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);
    for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
  return result;
}
function hashPw(pw,salt){let h=salt+'|'+pw;for(let i=0;i<300;i++)h=sha256(h+salt);return h}

/* =========================================================================
   1. REFERENCE DATA: roles, permissions, types
   ========================================================================= */
const PERMS={
  view:'View live stock and catalogue',see_value:'See stock value and prices',
  request_create:'Raise stock requests',request_approve:'Approve or reject requests',
  issue:'Issue stock and create challans',stock_in:'Enter stock received',
  return:'Process returns',adjust:'Make stock adjustments',reverse:'Reverse ledger entries',
  parts_edit:'Add and edit parts',parts_deactivate:'Deactivate parts',
  destinations_edit:'Manage destinations',reports:'View reports and ledger',export:'Export CSV',
  users_manage:'Manage users',audit_view:'View audit log',settings:'System settings and data'
};
const ROLES={
  super_admin:{label:'Super Admin',perms:'*',desc:'Highest system authority'},
  owner:{label:'Owner',perms:'*',desc:'Highest business authority'},
  sales_manager:{label:'Sales Manager',perms:['view','see_value','request_create','request_approve','reports','export']},
  service_manager:{label:'Service Manager',perms:['view','see_value','request_create','request_approve','reports','export']},
  warehouse_manager:{label:'Warehouse Manager',perms:['view','see_value','request_create','request_approve','issue','stock_in','return','adjust','parts_edit','destinations_edit','reports','export']},
  stock_in:{label:'Stock-In Person',perms:['view','stock_in','parts_edit']},
  storekeeper:{label:'Storekeeper',perms:['view','request_create','issue','return']},
  sales_rep:{label:'Sales Representative',perms:['view','request_create']},
  viewer:{label:'Viewer',perms:['view','reports']}
};
const MODELS=['Universal','Classic 350','Bullet 350','Hunter 350','Meteor 350','Goan Classic 350','Himalayan 450','Guerrilla 450','Scram 440','Interceptor 650','Continental GT 650','Super Meteor 650','Shotgun 650','Bear 650'];
const DEST_TYPES={customer_vehicle:'Customer vehicle',counter_sale:'Counter sale',display:'Display',department:'Internal department',offsite:'Offsite storage'};
const MV={OPENING:['Opening','blue','box'],IN:['Stock in','green','in'],ISSUE:['Issue','gold','out'],RETURN:['Return','blue','undo'],ADJUST:['Adjustment','amber','edit'],REVERSAL:['Reversal','red','undo']};
const REQ_B={Requested:'amber',Approved:'blue','Partially issued':'gold',Issued:'green','Closed short':'green',Rejected:'red',Cancelled:'muted'};
const STATUS_L={out:['Out of stock','red'],low:['Low stock','amber'],over:['Overstocked','blue'],ok:['In stock','green']};
const ADJ_REASONS=['Physical count correction','Damaged in store','Missing / lost','Found in store','Other'];

/* =========================================================================
   2. DATA LAYER (localStorage). Swap this block for a real backend later.
   ========================================================================= */
const STORE_KEY='ja_stock_mvp_v1',SESSION_KEY='ja_stock_session';
let DB=null,STORAGE_OK=true,_bal=null,_hold=null;
function baseDB(){return{version:1,createdAt:Date.now(),
  settings:{dealership:'Jain Automobiles',branch:'Hisar',dealerCode:'11614',approvalRequired:false,allowNegative:false,sessionHours:10},
  users:[],parts:[],destinations:[],ledger:[],requests:[],challans:[],inwards:[],audit:[],counters:{},loginGuard:{}}}
function readStore(){try{const t=localStorage.getItem(STORE_KEY);return t?JSON.parse(t):null}catch(e){STORAGE_OK=false;return null}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB))}catch(e){STORAGE_OK=false}}
function invalidate(){_bal=null;_hold=null}
function load(){const d=readStore();if(d&&d.version===1){DB=d}else{seed();save()}invalidate()}
function reloadFromStore(){const d=readStore();if(d)DB=d;invalidate()}
/* mutate(): read latest, apply change, roll back completely on any error.
   In production this is one DB transaction with row locks. */
function mutate(fn){reloadFromStore();const snap=JSON.stringify(DB);
  try{const r=fn();save();invalidate();return r}catch(e){DB=JSON.parse(snap);invalidate();throw e}}

function balances(){if(_bal)return _bal;const b={};for(const r of DB.ledger)b[r.partId]=(b[r.partId]||0)+r.qty;return _bal=b}
const stockOf=id=>balances()[id]||0;
function holdings(){if(_hold)return _hold;const h={};for(const r of DB.ledger){if(!r.destinationId)continue;(h[r.destinationId]=h[r.destinationId]||{});h[r.destinationId][r.partId]=(h[r.destinationId][r.partId]||0)-r.qty}return _hold=h}
const partById=id=>DB.parts.find(p=>p.id===id);
const destById=id=>DB.destinations.find(d=>d.id===id);
const reqById=id=>DB.requests.find(r=>r.id===id);
const userById=id=>DB.users.find(u=>u.id===id);
const activeParts=()=>DB.parts.filter(p=>p.active!==false);
function statusOf(p,q){if(q<=0)return'out';if(q<=(+p.minQty||0))return'low';if(+p.maxQty&&q>+p.maxQty)return'over';return'ok'}
function reversedSet(){return new Set(DB.ledger.filter(r=>r.reversesId).map(r=>r.reversesId))}
function isIssuable(r){return r.status==='Approved'||r.status==='Partially issued'||(r.status==='Requested'&&!DB.settings.approvalRequired)}
function fyLabel(ts){const d=new Date(ts);let y=d.getFullYear();if(d.getMonth()<3)y--;return y+'-'+String((y+1)%100).padStart(2,'0')}
function nextNo(kind){const fy=fyLabel(now());const key=kind+fy;DB.counters[key]=(DB.counters[key]||0)+1;
  const pre={DC:'JA/DC',REQ:'REQ',RTN:'RTN',ADJ:'ADJ',GRN:'GRN'}[kind];return pre+'/'+fy+'/'+String(DB.counters[key]).padStart(4,'0')}
function resolvePart(v){if(!v)return null;v=v.trim();const code=v.split(' · ')[0].trim().toLowerCase();const act=activeParts();
  let p=act.find(x=>x.partCode.toLowerCase()===code);if(p)return p;
  p=act.find(x=>(x.sku||'').toLowerCase()===code&&code);if(p)return p;
  const m=act.filter(x=>x.name.toLowerCase()===v.toLowerCase());return m.length===1?m[0]:null}
function challanReturnable(challanNo,partId){let n=0;for(const r of DB.ledger)if(r.challanNo===challanNo&&r.partId===partId&&r.destinationId)n-=r.qty;return n}
function refText(o){const a=[];if(o.chassis)a.push('Chassis '+o.chassis);if(o.salesInvoice)a.push('Inv '+o.salesInvoice);return a.length?' ('+a.join(', ')+')':''}

/* =========================================================================
   3. BUSINESS RULES (OPS). Each receives the acting user U.
      These become server endpoints in production.
   ========================================================================= */
function hasPerm(U,p){const r=ROLES[U.role];return !!r&&(r.perms==='*'||r.perms.includes(p))}
function audit(U,action,detail,entity){DB.audit.push({id:uid('AU'),ts:now(),userId:U?U.id:'',userName:U?U.name:'(unknown)',role:U?(ROLES[U.role]||{}).label:'',action,detail:detail||'',entity:entity||''})}
function post(U,partId,qty,type,extra){
  const p=partById(partId);if(!p)throw new Error('Unknown part');
  const before=stockOf(partId),after=before+qty;
  if(after<0&&!DB.settings.allowNegative)throw new Error('Not enough stock for '+p.partCode+' ('+p.name+'). Available '+before+', needed '+(-qty)+'.');
  const row=Object.assign({id:uid('MV'),ts:now(),type,partId,partCode:p.partCode,partName:p.name,qty,before,after,userId:U.id,userName:U.name,userRole:(ROLES[U.role]||{}).label,
    destinationId:null,destinationName:'',chassis:'',model:'',salesInvoice:'',supplierInvoice:'',challanNo:'',requestNo:'',requestedBy:'',issuedBy:'',reason:'',remarks:'',reversesId:null},extra||{});
  DB.ledger.push(row);balances()[partId]=after;_hold=null;return row}
function mergeLines(lines){const m={};for(const l of lines){const q=parseInt(l.qty,10);if(!(q>0))continue;m[l.partId]=(m[l.partId]||0)+q}return Object.keys(m).map(k=>({partId:k,qty:m[k]}))}
function validateRef(dest,d){
  const ch=(d.chassis||'').trim(),inv=(d.salesInvoice||'').trim();
  if(ch&&ch.replace(/[^a-z0-9]/gi,'').length<4)throw new Error('Chassis number needs at least the last 4 characters.');
  if(dest.type==='customer_vehicle'&&!ch&&!inv)throw new Error('For a customer vehicle, enter the chassis number (last 4 at least) or the sales invoice number.');
  if(dest.type==='counter_sale'&&!inv)throw new Error('For a counter sale, the sales invoice number is required.')}

const OPS={
  stockIn(U,d){
    if(!String(d.invoiceNo||'').trim())throw new Error('Enter the Royal Enfield invoice number.');
    const lines=mergeLines(d.lines||[]);if(!lines.length)throw new Error('Add at least one part with a quantity.');
    const grn=nextNo('GRN');
    lines.forEach(l=>post(U,l.partId,l.qty,'IN',{supplierInvoice:d.invoiceNo.trim(),grnNo:grn,remarks:d.remarks||'',reason:'Received from '+(d.supplier||'Royal Enfield')}));
    DB.inwards.push({no:grn,ts:now(),invoiceNo:d.invoiceNo.trim(),invoiceDate:d.invoiceDate||'',supplier:d.supplier||'',lines,userId:U.id,userName:U.name,remarks:d.remarks||''});
    audit(U,'Stock in',grn+': invoice '+d.invoiceNo+', '+lines.length+' line(s), '+sum(lines,'qty')+' unit(s)',grn);return grn},
  createRequest(U,d){
    const dest=destById(d.destinationId);if(!dest||dest.active===false)throw new Error('Choose where the stock is going.');
    validateRef(dest,d);const items=mergeLines(d.items||[]);if(!items.length)throw new Error('Add at least one part with a quantity.');
    const rb=userById(d.requestedById)||U;
    const r={id:uid('RQ'),no:nextNo('REQ'),ts:now(),status:'Requested',destinationId:dest.id,destinationName:dest.name,destType:dest.type,
      chassis:(d.chassis||'').toUpperCase().trim(),model:d.model||'',salesInvoice:(d.salesInvoice||'').trim(),customer:(d.customer||'').trim(),
      items:items.map(i=>{const p=partById(i.partId);return{partId:i.partId,partCode:p.partCode,partName:p.name,qty:i.qty,issued:0}}),
      remarks:d.remarks||'',requestedById:rb.id,requestedByName:rb.name,createdById:U.id,createdByName:U.name,
      history:[{ts:now(),by:U.name,action:'Requested'+(rb.id!==U.id?' on behalf of '+rb.name:'')}],challans:[]};
    DB.requests.push(r);audit(U,'Request created',r.no+' to '+dest.name+refText(r)+', '+items.length+' line(s)',r.no);return r},
  approve(U,id){const r=reqById(id);if(!r||r.status!=='Requested')throw new Error('Only a new request can be approved.');
    r.status='Approved';r.approvedByName=U.name;r.history.push({ts:now(),by:U.name,action:'Approved'});audit(U,'Request approved',r.no,r.no)},
  reject(U,id,reason){const r=reqById(id);if(!r||!['Requested','Approved'].includes(r.status))throw new Error('This request can no longer be rejected.');
    if(!String(reason||'').trim())throw new Error('Give a reason for rejecting.');
    r.status='Rejected';r.history.push({ts:now(),by:U.name,action:'Rejected: '+reason});audit(U,'Request rejected',r.no+': '+reason,r.no)},

let ME=null;
function getSession(){try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY));if(s&&s.exp>Date.now())return s}catch(e){}return null}
function currentUser(){const s=getSession();if(!s)return null;const u=DB.users.find(x=>x.id===s.userId&&x.active&&!x.deleted);return u||null}
function signIn(username,pw){
  reloadFromStore();username=String(username||'').trim().toLowerCase();
  const g=DB.loginGuard[username];if(g&&g.until>Date.now())throw new Error('Too many failed attempts. Try again in '+Math.ceil((g.until-Date.now())/60000)+' minute(s).');
  const U=DB.users.find(u=>u.username===username&&!u.deleted);const ok=U&&U.hash===hashPw(pw,U.salt);
  if(!ok){const gg=DB.loginGuard[username]||{fails:0,until:0};gg.fails++;let msg='Incorrect username or password.';
    if(gg.fails>=5){gg.until=Date.now()+5*60000;gg.fails=0;msg='Too many failed attempts. Sign-in locked for 5 minutes.'}
    DB.loginGuard[username]=gg;audit(U||null,'Sign-in failed','Username "'+username+'"','auth');save();throw new Error(msg)}
  if(!U.active){audit(U,'Sign-in blocked','Account deactivated','auth');save();throw new Error('This account has been deactivated. Contact the administrator.')}
  delete DB.loginGuard[username];U.lastLogin=Date.now();audit(U,'Signed in','','auth');save();
  sessionStorage.setItem(SESSION_KEY,JSON.stringify({userId:U.id,exp:Date.now()+(DB.settings.sessionHours||10)*3600e3}));ME=U}
function signOut(silent){if(ME&&!silent){try{mutate(()=>audit(ME,'Signed out','','auth'))}catch(e){}}sessionStorage.removeItem(SESSION_KEY);ME=null;closeModal();location.hash='';render()}

  CLOCK+=15*60000;OPS.issue(U('US_ST'),pr.id,[{partId:pid(3),qty:2}],'Tank bag out of stock, balance pending');

function analytics(){const t=Date.now(),bal=balances();const d30=t-30*DAY,d60=t-60*DAY,d90=t-90*DAY;
  const rows=activeParts().map(p=>{let o30=0,o90=0,last=0;for(const r of DB.ledger){if(r.partId!==p.id||r.type!=='ISSUE')continue;const q=-r.qty;if(r.ts>=d30)o30+=q;if(r.ts>=d90)o90+=q;if(r.ts>last)last=r.ts}
    const qty=bal[p.id]||0;const daily=o90/90;const cover=daily>0?Math.round(qty/daily):null;return{p,qty,o30,o90,last,daily,cover}});
  const moving=rows.filter(r=>r.o30>0).map(r=>r.o30).sort((a,b)=>b-a);const fastCut=Math.max(2,moving[Math.floor(moving.length/4)]||2);
  rows.forEach(r=>{const p=r.p;let cls;if(r.qty>0&&(!r.last||r.last<d60))cls='Dead stock';else if(r.o30>=fastCut)cls='Fast moving';else if(r.o90>0)cls='Slow moving';else cls='No movement';
    r.cls=cls;r.over=+p.maxQty>0&&r.qty>+p.maxQty;let target=Math.max(p.minQty*2,Math.ceil(r.daily*45));if(+p.maxQty)target=Math.min(target,+p.maxQty);r.reorder=Math.max(0,target-r.qty);
    r.action=cls==='Dead stock'?'Consider discount or return to RE':r.over?'Hold purchases, run an offer':r.qty<=p.minQty?'Reorder now':r.reorder>0&&cls==='Fast moving'?'Plan reorder':'-'});
  return rows}

    '<label class="field">Name<input name="name" value="'+esc(d.name)+'" required placeholder="e.g. Display bike: Shotgun 650"></label><label class="field">Type<select name="type">'+Object.entries(DEST_TYPES).map(([k,v])=>'<option value="'+k+'" '+(k===d.type?'selected':'')+'>'+v+'</option>').join('')+'</select></label>'+
    '<label class="field">Note<input name="note" value="'+esc(d.note||'')+'"></label></div></form>',foot:'<button class="btn ghost" onclick="App.closeModal()">Cancel</button><button class="btn primary" form="f-dest">Save</button>'})},
  saveDest:guard((e,id)=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(id)d.id=id;API.call('saveDestination',d);closeModal();toast('Destination saved');refresh()}),
  openReport(id){VS.rep=id;VS.repF={};render();window.scrollTo(0,0)},
  repF(){const f=VS.repF;if($('#rf-from'))f.from=$('#rf-from').value;if($('#rf-to'))f.to=$('#rf-to').value;if($('#rf-ch'))f.chassis=$('#rf-ch').value;render()},
  repCSV(){const R=REPORTS.find(r=>r.id===VS.rep);const o=R.run(VS.repF);download('JA_'+R.id+'_'+stamp()+'.csv',toCSV(o.cols.map(c=>Object.assign({},c,{csv:c.csv||(c.html&&!c.k?null:c.csv)})),o.rows));
    try{mutate(()=>audit(ME,'Report exported',R.t,'export'))}catch(e){}},
  exportTab:guard(k=>{if(!can('export')&&!can('settings')&&k!=='audit')throw new Error('Your role cannot export data.');if(k==='audit'&&!can('audit_view'))throw new Error('Not allowed.');
    const t=SHEET_TABS.find(x=>x[0]===k);const o=t[2]();download('JA_'+k+'_'+stamp()+'.csv',toCSV(o.cols,o.rows));try{mutate(()=>audit(ME,'Data exported',t[1]+' ('+o.rows.length+' rows)','export'))}catch(e){}}),
  exportAll(){SHEET_TABS.forEach((t,i)=>setTimeout(()=>App.exportTab(t[0]),i*450))},
  template(){download('JA_parts_import_template.csv','﻿part_code,name,category,model,sku,uom,rack,purchase_price,selling_price,gst,min_qty,max_qty,opening_qty\r\nGMA-EXAMPLE-01,Example engine guard,Protection,Classic 350,JA-2001,Nos,D-09,2500,3400,28,2,8,5\r\n')},
  importParts:guard(inp=>{const file=inp.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const rows=parseCSV(rd.result);if(rows.length<2)throw new Error('The file has no data rows.');
    const head=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));if(!head.includes('part_code')||!head.includes('name'))throw new Error('Columns part_code and name are required. Use the template.');
    const objs=rows.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])));const res=API.call('importParts',objs);toast(res.created+' part(s) created, '+res.skipped+' skipped, '+res.units+' opening unit(s)');refresh()}catch(x){toast(x.message,'error')}inp.value=''};rd.readAsText(file)}),
  backup(){download('JA_stock_backup_'+stamp()+'.json',JSON.stringify(DB,null,1),'application/json');try{mutate(()=>audit(ME,'Backup downloaded','','export'))}catch(e){}},
  restore:guard(inp=>{const file=inp.files[0];if(!file)return;const rd=new FileReader();rd.onload=async()=>{inp.value='';try{const d=JSON.parse(rd.result);if(!d||d.version!==1||!Array.isArray(d.ledger)||!Array.isArray(d.users))throw new Error('This is not a valid backup file.');
    const ok=await ask('Restore this backup?','All current data in this browser will be replaced by the backup ('+d.parts.length+' parts, '+d.ledger.length+' ledger rows).','Restore',true);if(!ok)return;
    if(!can('settings'))throw new Error('Not allowed.');DB=d;invalidate();audit(ME,'Backup restored',file.name,'data');save();toast('Backup restored');refresh()}catch(x){toast(x.message,'error')}};rd.readAsText(file)}),
  resetDemo:guard(async()=>{const ok=await ask('Reload sample data?','Everything in this browser is replaced with the sample dealership data. Logins go back to the test passwords.','Reload sample data',true);if(!ok)return;seed();save();invalidate();
    sessionStorage.setItem(SESSION_KEY,JSON.stringify({userId:'US_SUPER',exp:Date.now()+10*3600e3}));ME=userById('US_SUPER');toast('Sample data loaded. You are signed in as Super Admin.');ROUTE='dashboard';location.hash='#/dashboard';render()}),
  startFresh:guard(async()=>{const v=await ask('Start with an empty system?','All parts, stock, requests and users are removed. Only the Super Admin login remains, with its current password. Type RESET to confirm.','Erase everything',true,'Type RESET');if(v===null)return;
    if(v.trim()!=='RESET')throw new Error('Not erased. You must type RESET.');const su=userById('US_SUPER')||DB.users.find(u=>u.role==='super_admin');const keep=DB.settings;DB=baseDB();DB.settings=keep;DB.users.push(su);
    DB.destinations=[['DS_CUST','Customer vehicle','customer_vehicle'],['DS_COUNTER','Counter sale','counter_sale'],['DS_SWALL','Sales display wall','display'],['DS_SVWALL','Service display wall','display'],['DS_WS','Service workshop','department']].map(d=>({id:d[0],name:d[1],type:d[2],note:'',active:true}));
    audit(su,'System reset','All data erased; empty system started','data');save();invalidate();sessionStorage.setItem(SESSION_KEY,JSON.stringify({userId:su.id,exp:Date.now()+10*3600e3}));ME=su;toast('Empty system ready. Add parts or upload your physical count.');location.hash='#/settings';render()}),
  saveSettings:guard(e=>{e.preventDefault();const f=e.target;API.call('saveSettings',{approvalRequired:f.approvalRequired.checked,allowNegative:f.allowNegative.checked,dealership:f.dealership.value.trim()||'Jain Automobiles',branch:f.branch.value.trim(),dealerCode:f.dealerCode.value.trim(),sessionHours:Math.min(24,Math.max(1,parseInt(f.sessionHours.value,10)||10))});toast('Settings saved');refresh()}),
  userForm(id){const u=id?userById(id):{name:'',username:'',role:'sales_rep',phone:''};const roles=Object.keys(ROLES).filter(r=>r!=='super_admin'||ME.role==='super_admin'||u.role==='super_admin');
    openModal({title:id?'Edit user':'Add user',body:'<form id="f-user" onsubmit="App.saveUser(event,\''+(id||'')+'\')"><div class="form-grid"><label class="field">Full name<input name="name" value="'+esc(u.name)+'" required></label>'+
     '<label class="field">Username (for sign-in)<input name="username" value="'+esc(u.username)+'" required autocapitalize="none" spellcheck="false"></label>'+
     '<label class="field">Role<select name="role">'+roles.map(r=>'<option value="'+r+'" '+(r===u.role?'selected':'')+'>'+ROLES[r].label+'</option>').join('')+'</select></label><label class="field">Phone<input name="phone" value="'+esc(u.phone||'')+'" inputmode="tel"></label>'+
     (id?'':'<label class="field span-2">Starting password (8+ characters)<input name="password" type="text" required minlength="8" autocomplete="off" placeholder="Share this with the person privately"></label>')+'</div></form>'+
     (id?'<div class="section-title">Recent sign-ins and actions</div>'+tableHTML([{label:'When',html:a=>fmtDT(a.ts)},{label:'Action',k:'action'},{label:'Detail',html:a=>'<span class="sub">'+esc(a.detail)+'</span>'}],DB.audit.filter(a=>a.userId===id).slice(-8).reverse(),{empty:'No activity yet.'}):''),
     foot:(id&&id!==ME.id?'<button class="btn ghost" onclick="App.toggleUser(\''+id+'\')">'+(u.active?'Deactivate':'Activate')+'</button><button class="btn danger" onclick="App.removeUser(\''+id+'\')">Remove</button>':'')+'<button class="btn primary" form="f-user">'+icon('check',18)+' Save</button>'})},
  saveUser:guard((e,id)=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(id)d.id=id;const u=API.call('saveUser',d);closeModal();toast((id?'Saved ':'Created ')+u.name);refresh()}),
  resetPw:guard(async id=>{const u=userById(id);const pw=await ask('Reset password for '+u.name,'Type a new password (8+ characters) and share it with them privately.','Set password',false,'New password');if(pw===null)return;try{API.call('resetPassword',id,pw);toast('Password reset for '+u.name)}catch(x){toast(x.message,'error')}}),
  toggleUser:guard(id=>{const u=userById(id);API.call('setUserActive',id,!u.active);closeModal();toast(u.name+(u.active?' deactivated':' activated'));refresh()}),
  removeUser:guard(async id=>{const u=userById(id);const ok=await ask('Remove '+u.name+'?','They can no longer sign in. Everything they did stays in the ledger and audit log.','Remove user',true);if(!ok)return;try{API.call('removeUser',id);toast(u.name+' removed');refresh()}catch(x){toast(x.message,'error')}})
};
window.App=App;window.VS=VS;window.render=render;

/* =========================================================================
   10. START
   ========================================================================= */
load();ME=currentUser();
{const k=(location.hash.replace(/^#\/?/,'')||'dashboard');ROUTE=ROUTES[k]?k:'dashboard'}
render();
</script>
